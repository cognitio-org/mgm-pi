name: Outfitter deploy
# Production deploys for Outfitter (outfitter/deploy/README.md "Deploying"). Pushing a release tag
# `outfitter-v*` (outfitter/deploy/tag-release.sh) tests that commit, then runs
# outfitter/deploy/release.sh on it: all three components move to that commit, the Job first, and
# the run refuses a commit that isn't on main or would roll production back. Merging to main only
# runs CI ("Outfitter CI").
#
# Run workflow redeploys an existing release: pick the outfitter-v* tag under "Use workflow from"
# (rollbacks: the previous tag with `rollback` ticked; or a re-run of a release that failed
# halfway). Runs from anything but an outfitter-v* tag are refused: only admins can create those
# tags (ci-setup.sh's ruleset), and GCP trusts this workflow only at one (its provider condition),
# so every deploy is code an admin tagged, with that tag's own copy of this file.
#
# Idle until outfitter/deploy/ci-setup.sh has set the GCP_WIF_PROVIDER and GCP_DEPLOY_SA repository
# variables.
on:
  push:
    tags: ["outfitter-v*"]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Allow deploying a commit older than production (ROLLBACK=1)"
        type: boolean
        default: false
      force_all:
        description: "Redeploy components already at that commit (FORCE_ALL=1)"
        type: boolean
        default: false

# One deploy at a time, never cancelled midway. A newer run waiting here replaces an older waiting
# one (a manual re-run included), so re-run anything that got replaced.
concurrency:
  group: outfitter-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CI only runs when outfitter/ or kernal/ change, so a tagged commit may never have been tested on
  # its own: test exactly what is about to ship.
  test:
    if: vars.GCP_WIF_PROVIDER != '' && startsWith(github.ref, 'refs/tags/outfitter-v')
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    defaults: { run: { working-directory: outfitter } }
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: outfitter/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Deploy scripts lint and guard tests
        run: |
          shellcheck -x -S warning deploy/*.sh
          shellcheck -s bash -S warning deploy/config.env
          bash deploy/test/guards.test.sh
          bash deploy/test/agent-job-build.test.sh
          bash deploy/test/gke-cluster.test.sh
          bash deploy/test/gke-skew.test.sh
          bash deploy/test/gke-iam.test.sh
          bash deploy/test/e2e-identity.test.sh
          bash deploy/test/gke-template.test.sh
          bash deploy/test/gke-schedule.test.sh
          bash deploy/test/gke-teardown.test.sh
          bash deploy/test/release-gke-off.test.sh
          bash deploy/test/service-env-gke-off.test.sh
          bash deploy/test/gke-workflow-check.test.sh
          bash deploy/test/heredoc-backticks.test.sh
          bash deploy/test/gcloud-mcp-iam.test.sh
          bash deploy/test/gcloud-mcp-router.test.sh
          bash deploy/test/google-cloud-mcp.test.sh

  deploy:
    needs: test
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Writes gha-creds-*.json into the workspace: kept out of every Cloud Build upload by the
      # repo root's .gcloudignore and outfitter/.gcloudignore.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Check whether GKE is configured
        id: gke
        working-directory: outfitter/deploy
        run: ./gke-workflow-check.sh
      - uses: google-github-actions/setup-gcloud@v2
        with:
          # env.sh public_origin lists domain mappings with `gcloud beta run domain-mappings`.
          # kubectl and gke-gcloud-auth-plugin only when config.env has GKE_CLUSTER set: gke-
          # template.sh (release.sh's step between the Job and link) then gets a kubeconfig via
          # `gcloud container clusters get-credentials --dns-endpoint` into a temp file (env.sh's
          # gke_kubeconfig) and applies the SandboxTemplate/SandboxWarmPool through it.
          install_components: ${{ steps.gke.outputs.components }}
      - name: Release
        working-directory: outfitter/deploy
        env:
          ROLLBACK: ${{ inputs.rollback && '1' || '' }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '' }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: ./release.sh

  # #219: Playwright against what just shipped, signed in through IAP as outfitter-e2e. A separate
  # workflow file with its own Workload Identity pool: this workflow's deploy credentials never
  # reach it, and its token can't deploy. Skipped until e2e-identity.sh has set its variables.
  live:
    needs: deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/outfitter-live.yml

  # #421: the Sentry release named after the tag (what OUTFITTER_RELEASE makes the api, link,
  # Drives and web app report), its commits linked from a full checkout of the commit the deploy
  # shipped, finalized, and a production deploy recorded. A redeploy or rollback of an existing tag
  # just records another deploy on that release. Its own job, never the deploy's: there
  # google-github-actions/auth leaves the deployer's credentials file in the workspace and
  # GOOGLE_APPLICATION_CREDENTIALS in the environment, and getsentry/action-release runs a docker
  # image pulled by tag (ghcr.io/getsentry/action-release-image), which the action's SHA pin
  # doesn't cover. No id-token, no GCP auth here. Runs beside `live`, gating nothing. Skipped until the
  # SENTRY_ORG / SENTRY_PROJECT variables and the SENTRY_AUTH_TOKEN secret are set (deploy/README.md
  # "Sentry releases"); a Sentry failure never fails a deploy that already happened.
  sentry-release:
    needs: deploy
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Check whether Sentry releases are configured
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SENTRY_ORG, SENTRY_PROJECT or SENTRY_AUTH_TOKEN not set; Sentry release skipped"
          fi
      - uses: useblacksmith/checkout@v1
        if: steps.sentry.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Sentry release
        if: steps.sentry.outputs.enabled == 'true'
        continue-on-error: true
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: ${{ github.ref_name }}
          environment: production
          set_commits: auto
          # A rollback's or first release's previous-release commit may not be found; still create it.
          ignore_missing: true
          ignore_empty: true
          finalize: true
          disable_telemetry: true
