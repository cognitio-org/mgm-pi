# Included in every location: nginx drops server-level add_header in any location that sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# The sha256 is the inline theme script in index.html's <head>; update it if that script changes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-x6Ww+4QZhUJSDGt6cMyIxv9uYzrIZtoJgUo+Q7J0DCQ='; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
