<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kernal options</title>
  <link rel="stylesheet" href="outfitter.css">
  <style>
    main { position: relative; z-index: 0; max-width: 36rem; margin: 0 auto; padding: 1.25rem 1.25rem 2rem; display: flex; flex-direction: column; gap: 0.85rem; }
    .brand { border: 0; box-shadow: none; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <header class="panel brand">
      <div class="panel-titlebar"><span class="panel-label">Kernal</span></div>
    </header>
    <p class="hint">Paste the same two values the Tokens page prints. The Dongle stays in chrome.storage.local on this computer. Saving the link origin asks Chrome for permission to call that host.</p>
    <form id="settings" class="panel">
      <div class="panel-titlebar"><span class="panel-label">Dongle</span></div>
      <div class="panel-body">
        <label class="field" for="token">OUTFITTER_TOKEN</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="outf_…">
        <p id="token-state" class="hint"></p>
        <label class="field" for="origin">OUTFITTER_API</label>
        <input id="origin" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="https://…">
        <div class="button-row">
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" id="remove" class="btn-danger">Remove Dongle</button>
        </div>
        <p id="status" role="status"></p>
      </div>
    </form>
    <p id="build" class="hint"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
