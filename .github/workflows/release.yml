name: kernal release
# Publish a GitHub release tagged vX.Y.Z (semver; pre-releases like v1.2.0-rc.1 allowed) and this
# builds, tests and attaches a self-contained bundle per platform: pi's official standalone binary
# for the pinned pi version + kernal's extensions, settings and locked extension packages. No Node
# needed by users. See kernal/scripts/package.sh.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs: { version: "${{ steps.v.outputs.version }}" }
    steps:
      - id: v
        run: |
          tag='${{ github.event.release.tag_name }}'
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$tag' is not semantic versioning (vMAJOR.MINOR.PATCH[-prerelease])"; exit 1; fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
  test:
    needs: validate
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: kernal } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: kernal/package-lock.json }
      - run: npm ci
      - name: Extension packages install from the lockfile
        run: npm ci --legacy-peer-deps --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: kernal/.pi/npm
      - run: npm test
  live:
    # Real calls to the router (< $0.01). Skips itself when the LITELLM_CI_KEY secret is absent.
    needs: [validate, test]
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: kernal } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: kernal/package-lock.json }
      - run: npm ci
      - env:
          LITELLM_AGENT_KEY: ${{ secrets.LITELLM_CI_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL || 'https://router.kernal.one/v1' }}
        run: |
          if [[ -z "$LITELLM_AGENT_KEY" ]]; then echo "::notice::LITELLM_CI_KEY secret not set; live tests skipped"; exit 0; fi
          npm run test:live
  build:
    needs: [validate, test, live]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: linux-x64,    os: ubuntu-24.04 }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: kernal } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Stamp the version
        run: npm version "${{ needs.validate.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build, smoke-test and checksum the bundle
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}   # shipped in the bundle's .env when set
        run: scripts/package.sh "${{ needs.validate.outputs.version }}" "${{ matrix.platform }}"
      - name: Attach to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload '${{ github.event.release.tag_name }}' dist/kernal-*.tar.gz dist/kernal-*.tar.gz.sha256 --clobber
  installer:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Attach the installer script
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload '${{ github.event.release.tag_name }}' kernal/scripts/install.sh --clobber
  # #421: the Sentry release kernal@X.Y.Z (what a bundle's Sentry extension reports, kernal/.pi/
  # extensions/sentry/config.ts releaseName), its commits linked, finalized. No deploy marker: a
  # bundle is downloaded, not deployed. Skipped until the SENTRY_ORG / SENTRY_PROJECT variables and
  # the SENTRY_AUTH_TOKEN secret are set (outfitter/deploy/README.md "Sentry releases"); a Sentry
  # failure never fails the release.
  sentry:
    needs: [validate, build, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check whether Sentry releases are configured
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SENTRY_ORG, SENTRY_PROJECT or SENTRY_AUTH_TOKEN not set; Sentry release skipped"
          fi
      - uses: actions/checkout@v5
        if: steps.sentry.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - name: Sentry release
        if: steps.sentry.outputs.enabled == 'true'
        continue-on-error: true
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: kernal@${{ needs.validate.outputs.version }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
          finalize: true
          disable_telemetry: true
