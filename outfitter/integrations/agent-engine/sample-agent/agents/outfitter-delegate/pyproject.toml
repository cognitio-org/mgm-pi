[project]
name = "outfitter-delegate"
version = "0.1.0"
description = "Agent Engine agent that delegates coding tasks to Outfitter over A2A"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the 0.11.x line the tests ran against (CI: uv sync --group sdk). The image
    # resolves these fresh at build time, so a looser range would deploy untested versions.
    "agent-engine-runner-shared[mongodb]~=0.11.7",
    "agent-engine-sdk-langgraph~=0.11.7",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.12",
    # outfitter_tools.py
    "a2a-sdk==1.2.1",
    "httpx>=0.28,<1",
]

[project.scripts]
outfitter-delegate = "outfitter_delegate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outfitter_delegate"]
