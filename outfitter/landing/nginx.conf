# Cloud Run sends traffic to port 8080 and terminates TLS in front of us, so redirects nginx builds
# itself (a directory without its trailing slash) must stay relative, not http://host:8080/.
absolute_redirect off;
server_tokens off;

# One canonical host: www.kernal.one -> kernal.one, with the same headers as every other response.
server {
  listen 8080;
  server_name www.kernal.one;
  include /etc/nginx/security-headers.conf;
  return 301 https://kernal.one$request_uri;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;

  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ =404;
  }
}
