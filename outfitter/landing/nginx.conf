# Cloud Run sends traffic to port 8080 and terminates TLS in front of us.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # One canonical host: www.kernal.one -> kernal.one.
  if ($host = "www.kernal.one") {
    return 301 https://kernal.one$request_uri;
  }

  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ =404;
  }
}
