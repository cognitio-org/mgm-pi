# Kernal pins pi and its extension packages per release, so new versions must arrive as pull requests
# that CI tests, not as notices telling users to run pi's own updater (which a bundle ignores).
#
# Every PR here runs CI, and CI minutes cost money (docs/ci-runners.md). So version updates come
# monthly, and each entry groups its security updates into one PR (`applies-to: security-updates`)
# instead of one PR per vulnerable package. Security updates don't wait for the schedule.
version: 2
updates:
  # pi itself: kernal/package.json pins the version whose compiled binary every bundle downloads
  - package-ecosystem: npm
    directory: /kernal
    schedule: { interval: monthly }
    allow:
      - dependency-name: "@earendil-works/pi-coding-agent"
    groups:
      pi-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, pi]
    commit-message: { prefix: "pi" }
  # the extension packages every bundle ships, pinned from this lockfile
  - package-ecosystem: npm
    directory: /kernal/.pi/npm
    schedule: { interval: monthly }
    groups:
      pi-packages:
        patterns: ["*"]
      pi-packages-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, packages]
    commit-message: { prefix: "packages" }
  # Outfitter's workspaces (api, agentd, web, provider-local), from the root lockfile. Without this
  # the api's MongoDB driver sat a major behind (6.21 vs 7.6, #228) with nobody told. Minor and patch
  # updates arrive as one grouped PR; each major version gets its own PR, to be read before merging.
  - package-ecosystem: npm
    directory: /outfitter
    schedule: { interval: monthly }
    groups:
      outfitter-minor-patch:
        update-types: [minor, patch]
      outfitter-security:
        applies-to: security-updates
        patterns: ["*"]
    # @types/node follows the Node major the code runs on (24: setup-node, the images), not the
    # newest Node. Raise it together with the runtime, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, javascript]
    commit-message: { prefix: "outfitter" }
  # the kernal.one landing page's nginx base image, pinned by digest (outfitter/landing/Dockerfile):
  # without this the pin would never pick up nginx/Alpine security fixes
  - package-ecosystem: docker
    directory: /outfitter/landing
    schedule: { interval: monthly }
    labels: [dependencies, landing]
    commit-message: { prefix: "landing" }
  # The Agent Engine integration's Python packages (outfitter/integrations/agent-engine/uv.lock).
  # Security updates already arrived for it; this groups them and adds monthly version updates.
  - package-ecosystem: uv
    directory: /outfitter/integrations/agent-engine
    schedule: { interval: monthly }
    groups:
      agent-engine:
        patterns: ["*"]
      agent-engine-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, python]
    commit-message: { prefix: "agent-engine" }
