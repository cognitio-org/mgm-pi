name: Outfitter CI
on:
  push:
    branches: [main]
    paths: ["outfitter/**", "kernal/**", ".github/workflows/outfitter-ci.yml"]
  pull_request:
    paths: ["outfitter/**", "kernal/**", ".github/workflows/outfitter-ci.yml"]
# A PR branch that is pushed again (an amended commit, a rebase, one of several agent sessions
# force-pushing) used to leave the previous run billing to completion: on a private repo those are
# metered minutes spent on a commit nobody will look at again. Supersede them instead. Pushes to
# main are never cancelled -- main's run is the one that says whether main is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: outfitter } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: outfitter/package-lock.json }
      # packages/api's Mongo-backed tests start a real mongod (mongodb-memory-server). Cache the
      # binary so only the first run on a new version downloads it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('outfitter/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      - name: Unit, integration and end-to-end tests (all workspaces)
        run: npm test
      - name: Deploy scripts lint and guard tests
        run: |
          shellcheck -x -S warning deploy/*.sh
          shellcheck -s bash -S warning deploy/config.env
          bash deploy/test/guards.test.sh
          bash deploy/test/agent-job-build.test.sh
          bash deploy/test/gke-cluster.test.sh
          bash deploy/test/gke-skew.test.sh
          bash deploy/test/gke-iam.test.sh
          bash deploy/test/e2e-identity.test.sh
          bash deploy/test/gke-template.test.sh
          bash deploy/test/gke-schedule.test.sh
          bash deploy/test/gke-teardown.test.sh
          bash deploy/test/release-gke-off.test.sh
          bash deploy/test/litellm-admin.test.sh
          bash deploy/test/mcp-identity-check.test.sh
          bash deploy/test/litellm-retire-keys.test.sh
          bash deploy/test/secret-scope.test.sh
          bash deploy/test/sentry-sourcemaps.test.sh
          bash deploy/test/service-env-gke-off.test.sh
          bash deploy/test/gke-workflow-check.test.sh
          bash deploy/test/heredoc-backticks.test.sh
          bash deploy/test/workflow-sh-quotes.test.sh
          bash deploy/test/gcloud-mcp-iam.test.sh
          bash deploy/test/gcloud-mcp-router.test.sh
          bash deploy/test/google-cloud-mcp.test.sh

  # E2.12: the deploy failures of 2026-09-20 were all image or deploy-env problems invisible to
  # `npm test`. Build both images the way deploy/ does and boot each with the environment the deploy
  # scripts set, so a packaging or boot-time config regression fails here instead of on Cloud Run.
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the control-plane image
        run: docker build -f outfitter/packages/api/Dockerfile -t outfitter-api:ci outfitter/
      - name: Boot the control-plane image in the link role with the deploy environment
        run: |
          docker run -d --name api -p 18080:8080 \
            -e MONGODB_URI=memory -e OUTFITTER_DEV=1 -e OUTFITTER_DEV_TOKEN=ci \
            -e OUTFITTER_ROLE=link -e OUTFITTER_ORIGIN=http://localhost:8080 \
            -e AGENT_SA_EMAIL=agent@ci.local -e GCP_PROJECT=ci -e GCP_REGION=us-central1 \
            -e TUNNEL_DOMAIN_LMSTUDIO=ci.ngrok.app -e SANDBOX_PROVIDER=cloudrun -e CLOUDRUN_JOB=ci \
            -e IDLE_STOP_SECONDS=1800 outfitter-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://localhost:18080/api/hooks/ngrok || true)
            [ "$code" = "401" ] && break; sleep 1
          done
          docker logs api
          [ "$code" = "401" ] || { echo "link role did not come up (got '$code')"; exit 1; }
          # E4.1b: the link role now serves the teleport subset of /api/sessions behind personal API
          # tokens, so an unauthenticated request is 401 (not 404). The auth hook answers 401 for every
          # /api/ path before routing, so "browser-only routes are absent" is proven with a valid token
          # in packages/api/test/roles.test.ts rather than here.
          curl -s -o /dev/null -w '%{http_code}\n' http://localhost:18080/api/sessions | grep -qx 401
          curl -s -o /dev/null -w '%{http_code}\n' -H 'authorization: Bearer outf_not_a_real_token' http://localhost:18080/api/sessions | grep -qx 401
          docker rm -f api
      - name: Boot the control-plane image in the web role and exercise the SPA it now ships
        # Code review N6 (docs/reports/code-review-pr15.md): the images job only ever booted the
        # link role, which never reaches static.ts's SPA fallback code path at all. Boot the same
        # image in the web role (no IAP -- OUTFITTER_DEV=1) and confirm the web bundle baked into
        # this image (packages/web/dist) is actually served.
        run: |
          docker run -d --name api-web -p 18081:8080 \
            -e MONGODB_URI=memory -e OUTFITTER_DEV=1 -e OUTFITTER_DEV_TOKEN=ci \
            -e OUTFITTER_ROLE=web -e OUTFITTER_ORIGIN=http://localhost:8080 \
            -e SANDBOX_PROVIDER=inprocess -e AGENTD_MAIN=/app/packages/api/src/main.ts \
            outfitter-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/ || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          docker logs api-web
          [ "$code" = "200" ] || { echo "web role did not come up (got '$code')"; exit 1; }
          curl -s http://localhost:18081/ | grep -qi '<title>'
          curl -s -o /dev/null -w '%{http_code}\n' http://localhost:18081/sessions/x | grep -qx 200
          curl -s http://localhost:18081/api/nope -o /tmp/nope.json -w '%{http_code}\n' | grep -qx 404
          grep -qi 'error' /tmp/nope.json
          docker rm -f api-web
      - name: The control-plane image loads Sentry's profiler add-on (#424)
        # @sentry/profiling-node is a native add-on; the api loads it only when profiles are on and
        # skips it with a warning if it can't, so a broken one would otherwise go unnoticed.
        run: |
          docker run --rm --entrypoint node outfitter-api:ci -e \
            "import('@sentry/profiling-node').then((m) => { if (typeof m.nodeProfilingIntegration !== 'function') process.exit(1); console.log('profiling-node loads'); })"
      - name: Build the sandbox image
        run: docker build -f outfitter/image/Dockerfile -t outfitter-agent:ci .
      - name: agentd in the sandbox image loads Sentry's profiler add-on (#424)
        run: |
          docker run --rm --workdir /opt/outfitter/agentd --entrypoint node outfitter-agent:ci -e \
            "import('@sentry/profiling-node').then((m) => { if (typeof m.nodeProfilingIntegration !== 'function') process.exit(1); console.log('profiling-node loads'); })"
      - name: pi starts as the agent user with its own home and loads every extension
        run: |
          docker run --rm --entrypoint sh outfitter-agent:ci -c '
            set -e
            test "$(stat -c %U /workspace)" = agent
            test "$(stat -c %U:%G /run/outfitter)" = root:agent
            home=$(getent passwd agent | cut -d: -f6); test -d "$home"
            su agent -s /bin/sh -c "cd /tmp && HOME=$home /opt/kernal/node_modules/.bin/pi --version"
            out=$(su agent -s /bin/sh -c "cd /tmp && HOME=$home /opt/kernal/node_modules/.bin/pi --help" 2>&1) || { echo "$out"; exit 1; }
            ! echo "$out" | grep -qi "failed to load extension"
            ! test -e /opt/kernal/.pi/extensions/kernal-voice
            ! test -e /opt/kernal/.pi/extensions/kernal-admin
            ! test -e /opt/kernal/.pi/npm/node_modules/open-codebase-index
            ! test -e /opt/kernal/.pi/extensions/sentry
            ! test -e /opt/kernal/.pi/npm/node_modules/@sentry/node
            # Drive previews (#217): agentd starts the ngrok agent; it must be the pinned version.
            su agent -s /bin/sh -c "ngrok version" | tee /dev/stderr | grep -q "ngrok version 3\."
            # E9 PR8: the pi find tool needs fd (PI_OFFLINE=1 never downloads it); the foreman coder
            # child ships as a user agent; agent files from a cloned repo are kept out of discovery.
            su agent -s /bin/sh -c "fdfind --version"
            test -f /opt/kernal/.pi/agents/coder.md
            node -e "const s=require(\"/opt/kernal/.pi/settings.json\"); if (JSON.stringify(s.subagents.agentExcludeDirs)!==JSON.stringify([\"/workspace\",\"/home/agent/.agents\"])) { console.error(s.subagents); process.exit(1); }"
          '
      - name: code root runs isn't writable by agent; pi's agent dir is (#266)
        run: |
          docker run --rm --entrypoint sh outfitter-agent:ci -c '
            set -e
            for p in /opt/outfitter/agentd /opt/outfitter/agentd/dist/src /opt/kernal /opt/kernal/node_modules \
                     /opt/kernal/node_modules/@earendil-works/pi-coding-agent/dist; do
              if su agent -s /bin/sh -c "touch $p/.agent-write-test" 2>/dev/null; then echo "agent can write $p"; exit 1; fi
              test "$(stat -c %U "$p")" = root || { echo "$p is not root-owned"; exit 1; }
            done
            if su agent -s /bin/sh -c "echo x >> /opt/outfitter/agentd/dist/src/main.js" 2>/dev/null; then echo "agent can change agentd"; exit 1; fi
            # The whole of both trees, not a sample: nothing agent-owned or world-writable outside .pi.
            bad=$(find /opt/outfitter/agentd /opt/kernal -path /opt/kernal/.pi -prune -o \( -user agent -o -perm -o+w \) ! -type l -print | head -20)
            if [ -n "$bad" ]; then echo "agent-owned or world-writable under the root trees:"; echo "$bad"; exit 1; fi
            su agent -s /bin/sh -c "touch /opt/kernal/.pi/.agent-write-test && rm /opt/kernal/.pi/.agent-write-test"
            echo "ok: agentd and pi-coding-agent are root-owned; /opt/kernal/.pi stays agent-writable"
          '
      - name: pi-subagents loads as a bundle and still finds its own files (#142)
        run: |
          docker run --rm --entrypoint sh outfitter-agent:ci -c '
            set -e
            pkg=/opt/kernal/.pi/npm/node_modules/pi-subagents
            test -f "$pkg/bundle/index.js"
            node -e "const p=require(\"$pkg/package.json\"); if (JSON.stringify(p.pi.extensions)!==JSON.stringify([\"./bundle/index.js\"])) { console.error(p.pi.extensions); process.exit(1); }"
            home=$(getent passwd agent | cut -d: -f6)
            # /subagents-doctor runs locally (no model): it resolves the built-in agents dir, the runner
            # scripts and temp dirs through the rewritten import.meta.url paths. A broken rewrite loads
            # fine but finds 0 agents, which is what this catches. pi exits as soon as its stdin closes,
            # without waiting for a running command, so stdin (a fifo) stays open until the report is
            # out, or 60 s pass.
            fifo=$(mktemp -u); mkfifo "$fifo"; out=$(mktemp); chmod 666 "$fifo" "$out"
            su agent -s /bin/sh -c "cd /tmp && HOME=$home KERNAL_NO_DISCOVERY=1 timeout 90 /opt/kernal/node_modules/.bin/pi --mode rpc --no-session <$fifo >$out 2>&1" &
            exec 3>"$fifo"
            printf "%s\n" "{\"id\":\"d\",\"type\":\"prompt\",\"message\":\"/subagents-doctor\"}" >&3
            i=0; while [ "$i" -lt 60 ] && ! grep -q "agents: total" "$out"; do sleep 1; i=$((i + 1)); done
            exec 3>&-
            wait || true
            grep -q "agents: total" "$out" || { echo "no doctor report within 60 s:"; tail -40 "$out"; exit 1; }
            line=$(grep -o "agents: total [0-9]* (builtin [0-9]*[^)]*)" "$out" | head -1); echo "$line"
            echo "$line" | grep -qE "builtin [1-9]"
            echo "$line" | grep -qE "user [1-9]"     # the coder agent shipped in the image (E9 PR8)
            echo "$line" | grep -qE "project 0"      # agent files from a cloned repo stay out (E9 PR8)
          '
      - name: pi-mcp-adapter loads as a bundle and still talks MCP (#222)
        # A real round trip through the bundled adapter: pi (RPC mode, no model) with only the bundle
        # loaded, an agent dir whose mcp.json starts a tiny stdio MCP server (ci/echo-mcp-server.mjs,
        # mounted in, never in the image) eagerly, and "/mcp tools", which lists what it connected. That
        # exercises the bundled MCP client, its schemas, spawning the server and the lazily loaded
        # commands. The previous step already loads the bundle through settings.json (pi --help).
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/outfitter/image/ci/echo-mcp-server.mjs:/tmp/echo-mcp-server.mjs:ro" \
            outfitter-agent:ci -c '
            set -e
            pkg=/opt/kernal/.pi/npm/node_modules/pi-mcp-adapter
            test -f "$pkg/bundle/index.ts"
            node -e "const p=require(\"$pkg/package.json\"); if (JSON.stringify(p.pi.extensions)!==JSON.stringify([\"./bundle/index.ts\"])) { console.error(p.pi.extensions); process.exit(1); }"
            work=$(mktemp -d); mkdir -p "$work/agent" "$work/home" "$work/cwd"
            printf "%s\n" "{\"mcpServers\":{\"ci-echo\":{\"command\":\"node\",\"args\":[\"/tmp/echo-mcp-server.mjs\"],\"lifecycle\":\"eager\"}}}" >"$work/agent/mcp.json"
            printf "{}\n" >"$work/agent/settings.json"
            chown -R agent "$work"
            fifo="$work/in"; mkfifo "$fifo"; out="$work/out"; touch "$out"; chmod 666 "$fifo" "$out"
            # Same fifo pattern as the /subagents-doctor step: pi exits when stdin closes, so stdin stays
            # open until the listing is out, or 60 s pass.
            su agent -s /bin/sh -c "cd $work/cwd && HOME=$work/home PI_CODING_AGENT_DIR=$work/agent KERNAL_NO_DISCOVERY=1 timeout 90 /opt/kernal/node_modules/.bin/pi --mode rpc --no-session --no-extensions --extension $pkg/bundle/index.ts <$fifo >$out 2>&1" &
            exec 3>"$fifo"
            printf "%s\n" "{\"id\":\"m\",\"type\":\"prompt\",\"message\":\"/mcp tools\"}" >&3
            i=0; while [ "$i" -lt 60 ] && ! grep -q "ci-echo_ci_echo" "$out"; do sleep 1; i=$((i + 1)); done
            exec 3>&-
            wait || true
            grep -q "ci-echo_ci_echo" "$out" || { echo "the bundled adapter listed no ci_echo tool within 60 s:"; tail -40 "$out"; exit 1; }
            grep -o "MCP: [0-9]* servers connected ([0-9]* tools)" "$out" | head -1
            ! grep -qi "failed to load extension" "$out"
          '
      - name: agentd refuses to start without its run identity (and says so in structured JSON)
        run: |
          set +e
          out=$(docker run --rm outfitter-agent:ci 2>&1); code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ]
          echo "$out" | grep -q '"severity":"ERROR"'
