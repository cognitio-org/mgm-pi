name: Outfitter live tests
# Playwright against the deployed web app (#219). "Outfitter deploy" calls this after a successful
# release, and it can be run by hand: Run workflow, with an outfitter-v* tag under "Use workflow
# from" (normally the release in production). Either way it runs a release tag's own copy of this
# file and of the suite, so it tests exactly what that release shipped.
#
# Signs in through IAP as the outfitter-e2e service account. google-github-actions/auth mints its ID
# token through a Workload Identity pool of its own (deploy/e2e-identity.sh). That pool's provider,
# and the IAM grant itself, admit only this file at an outfitter-v* tag, which only repository admins
# can create (ci-setup.sh's tag ruleset). main is not trusted: it has no branch protection. The pool
# may mint the account's ID tokens and nothing else, and it never touches the deploy pool.
#
# The lifecycle test starts one real Drive and one short LLM turn on the "e2e (live tests)" Tape,
# checks the Composer's mic on it against real Deepgram (nothing is sent), then archives and formats
# the floppy it made (packages/web/live/app.live.mjs, live/voice.mjs).
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      skip_lifecycle:
        description: "Page smoke only: create no floppy (E2E_SKIP_LIFECYCLE=1)"
        type: boolean
        default: false

jobs:
  # The voice check's spoken sentence (#254, packages/web/live/voice.mjs), made here with espeak-ng
  # rather than in the live job: that job can mint the account's token, so nothing is installed
  # there. A failure here doesn't stop the live job; its voice check then fails, saying why.
  mic-fixture:
    if: vars.GCP_LIVE_WIF_PROVIDER != '' && startsWith(github.ref, 'refs/tags/outfitter-v')
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          espeak-ng -s 140 -w "${RUNNER_TEMP}/voice-fixture.wav" "Please fix the login bug and add a test."
      - uses: actions/upload-artifact@v4
        with:
          name: voice-fixture
          path: ${{ runner.temp }}/voice-fixture.wav
          retention-days: 1

  live:
    needs: mic-fixture
    # Off until e2e-identity.sh has set the repository variables; only from a release tag. Runs even
    # if mic-fixture failed (!cancelled()), so the page and lifecycle checks still report.
    if: ${{ !cancelled() && vars.GCP_LIVE_WIF_PROVIDER != '' && startsWith(github.ref, 'refs/tags/outfitter-v') }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    # One run at a time: two lifecycle runs would treat each other's floppies as leftovers.
    concurrency:
      group: outfitter-live
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: outfitter } }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: outfitter/package-lock.json }
      # This job can mint the account's token, so no dependency install script runs in it. The suite
      # only imports playwright-core, which needs none (it uses the runner's own Chrome).
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voice-fixture
          path: ${{ runner.temp }}/mic
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_LIVE_WIF_PROVIDER }}
          service_account: ${{ vars.E2E_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.E2E_IAP_AUDIENCE }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Live tests (system Chrome, already on the runner)
        env:
          E2E_IAP_TOKEN: ${{ steps.auth.outputs.id_token }}
          E2E_SERVICE_ACCOUNT: ${{ vars.E2E_SERVICE_ACCOUNT }}
          E2E_SKIP_LIFECYCLE: ${{ inputs.skip_lifecycle && '1' || '' }}
          E2E_ARTIFACTS: ${{ runner.temp }}/outfitter-live
          # #254: the fake mic's sentence, and fail rather than skip if Deepgram is off in production.
          E2E_MIC_FIXTURE: ${{ runner.temp }}/mic/voice-fixture.wav
          E2E_EXPECT_DEEPGRAM: "1"
        run: npm run test:live -w @outfitter/web
      # Every step's screenshot, pass or fail, with index.html to browse them (live/shots.mjs).
      # Other people's floppies are masked in each shot before it's taken: artifacts are readable by
      # anyone with repository read access.
      - id: shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outfitter-live-screenshots
          path: ${{ runner.temp }}/outfitter-live/shots/
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && steps.shots.outputs.artifact-url != ''
        env:
          SHOTS_URL: ${{ steps.shots.outputs.artifact-url }}
        run: |
          {
            echo "### Live-test screenshots"
            echo "[outfitter-live-screenshots](${SHOTS_URL}): unzip and open \`index.html\`. Kept 14 days; other people's floppies are masked."
          } >> "$GITHUB_STEP_SUMMARY"
      # The failure screenshot only: the page's text can name other people's floppies, and artifacts
      # are readable by anyone with repository read access.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outfitter-live-failure
          path: ${{ runner.temp }}/outfitter-live/*.png
          if-no-files-found: ignore
          retention-days: 14
