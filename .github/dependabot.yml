# Kernal pins pi and its extension packages per release, so new versions must arrive as pull requests
# that CI tests, not as notices telling users to run pi's own updater (which a bundle ignores).
version: 2
updates:
  # pi itself: kernal/package.json pins the version whose compiled binary every bundle downloads
  - package-ecosystem: npm
    directory: /kernal
    schedule: { interval: weekly }
    allow:
      - dependency-name: "@earendil-works/pi-coding-agent"
    labels: [dependencies, pi]
    commit-message: { prefix: "pi" }
  # the extension packages every bundle ships, pinned from this lockfile
  - package-ecosystem: npm
    directory: /kernal/.pi/npm
    schedule: { interval: weekly }
    groups:
      pi-packages:
        patterns: ["*"]
    labels: [dependencies, packages]
    commit-message: { prefix: "packages" }
  # Outfitter's workspaces (api, agentd, web, provider-local), from the root lockfile. Without this
  # the api's MongoDB driver sat a major behind (6.21 vs 7.6, #228) with nobody told. Minor and patch
  # updates arrive as one grouped PR; each major version gets its own PR, to be read before merging.
  - package-ecosystem: npm
    directory: /outfitter
    schedule: { interval: weekly }
    groups:
      outfitter-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, javascript]
    commit-message: { prefix: "outfitter" }
  # the kernal.one landing page's nginx base image, pinned by digest (outfitter/landing/Dockerfile):
  # without this the pin would never pick up nginx/Alpine security fixes
  - package-ecosystem: docker
    directory: /outfitter/landing
    schedule: { interval: weekly }
    labels: [dependencies, landing]
    commit-message: { prefix: "landing" }
